name: Build Windows app

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    env:
      # From Partner Center > Product management > Product identity (not secret:
      # these are written into every published package's manifest).
      IDENTITY_NAME: WajidAwan.BritishVoice
      PUBLISHER: CN=ADC9F747-9C47-4952-B515-FC8FEE53FED5
      PUBLISHER_DISPLAY_NAME: Wajid Awan
      DISPLAY_NAME: British Voice Converter
      VERSION: 1.0.${{ github.run_number }}.0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install libraries
        # PyInstaller's launcher is compiled from source here, which avoids the
        # antivirus false alarms its shared pre-built launcher sometimes triggers.
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: '1'
        run: |
          pip install -r requirements.txt
          pip install --no-binary pyinstaller pyinstaller

      - name: Build BritishVoice.exe
        run: >
          pyinstaller -y --onedir --windowed --name BritishVoice
          --icon packaging/icon.ico --add-data "team.json;." --add-data "CREDITS.md;." --add-data "LICENSE;."
          --collect-all kokoro_onnx --collect-all espeakng_loader
          --collect-all phonemizer --collect-all faster_whisper
          --collect-all ctranslate2 --collect-all onnxruntime
          --hidden-import sounddevice app.py

      - name: Self-test the built app
        shell: pwsh
        run: |
          $p = Start-Process dist\BritishVoice\BritishVoice.exe -ArgumentList '--self-test' -Wait -PassThru
          if (-not (Test-Path "$env:LOCALAPPDATA\BritishVoice\self_test_ok.txt")) {
            Get-Content "$env:LOCALAPPDATA\BritishVoice\error_log.txt" -ErrorAction SilentlyContinue
            throw "Self-test failed (exit code $($p.ExitCode))"
          }

      - name: Make Store package (MSIX)
        shell: pwsh
        run: |
          New-Item -ItemType Directory msix\Assets -Force | Out-Null
          Copy-Item dist\BritishVoice msix\BritishVoice -Recurse
          Copy-Item packaging\Assets\* msix\Assets
          $m = Get-Content packaging\AppxManifest.xml -Raw
          foreach ($k in 'IDENTITY_NAME','PUBLISHER','PUBLISHER_DISPLAY_NAME','DISPLAY_NAME','VERSION') {
            $m = $m.Replace("__${k}__", [Security.SecurityElement]::Escape((Get-Item "env:$k").Value))
          }
          Set-Content msix\AppxManifest.xml $m -Encoding utf8
          $mk = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\makeappx.exe" |
                Sort-Object FullName -Descending | Select-Object -First 1
          & $mk.FullName pack /d msix /p "BritishVoice-$env:VERSION.msix" /o
          if ($LASTEXITCODE) { throw "makeappx failed" }

      - name: Upload Store package
        uses: actions/upload-artifact@v4
        with:
          name: BritishVoice-Store-package
          path: BritishVoice-*.msix
